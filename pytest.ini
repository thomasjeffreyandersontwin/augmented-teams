[pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = agile_bot/test
pythonpath = .

# Output options
addopts = 
    -v
    --tb=short
    --color=yes
    --ignore=agile_bot/test/panel/test_output.txt
    
# Markers for organizing tests
markers =
    cli: CLI tests
    domain: Domain logic tests
    panel: Panel tests (JavaScript)
    smoke: Smoke tests
    integration: Integration tests

# Console output configuration
console_output_style = progress
